<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akila Laundry</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:#ddeeff;min-height:100vh;color:#1a3a5c;}
:root{
  --blue-dark:#1e5fa8;--blue:#3a7ec8;--blue-med:#5ba3e8;--blue-light:#b8d9f5;
  --blue-pale:#ddeeff;--blue-bg:#eef6ff;--blue-card:#f5faff;
  --text-dark:#1a3a5c;--text-med:#3a6080;--text-soft:#5a85b8;--text-muted:#8ab4d8;
  --white:#ffffff;--border:#cde4f8;--red:#c94040;--green:#1e8050;
  --shadow:0 4px 20px rgba(58,126,200,0.12);
}

/* LAYOUT */
.app-wrapper{max-width:720px;margin:0 auto;padding:0;min-height:100vh;background:var(--blue-bg);}
@media(max-width:480px){.app-wrapper{padding:0;}}

/* HEADER */
.header{background:linear-gradient(135deg,var(--blue-dark) 0%,var(--blue) 50%,var(--blue-med) 100%);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:0 2px 16px rgba(30,95,168,0.25);}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{width:42px;height:42px;background:rgba(255,255,255,0.2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;border:1.5px solid rgba(255,255,255,0.3);}
.logo-text{color:#fff;font-family:'Poppins',sans-serif;font-weight:700;font-size:17px;line-height:1.1;}
.logo-sub{color:rgba(255,255,255,0.7);font-size:10px;font-weight:500;letter-spacing:0.5px;}
.nav{display:flex;gap:6px;}
.nav-btn{background:rgba(255,255,255,0.15);border:1.5px solid rgba(255,255,255,0.3);color:rgba(255,255,255,0.85);padding:7px 15px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;font-family:'Nunito',sans-serif;}
.nav-btn:hover,.nav-btn.active{background:rgba(255,255,255,0.92);color:var(--blue);}

/* BODY */
.body{padding:20px 16px 32px;}

/* TOAST */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#1e8050;color:#fff;padding:10px 24px;border-radius:24px;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.15);}
.toast.show{opacity:1;}
.toast.error{background:#c94040;}

/* PAGE TITLE */
.page-title{font-family:'Poppins',sans-serif;font-weight:700;font-size:20px;color:var(--text-dark);margin-bottom:4px;}
.page-sub{font-size:13px;color:var(--text-soft);margin-bottom:20px;}

/* SERVICE CARDS */
.svc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
.svc-card{background:var(--white);border:2px solid var(--border);border-radius:18px;padding:22px 16px;text-align:center;cursor:pointer;transition:all 0.22s;position:relative;overflow:hidden;}
.svc-card:hover{border-color:var(--blue);transform:translateY(-4px);box-shadow:0 10px 28px rgba(58,126,200,0.18);}
.svc-card:active{transform:translateY(-1px);}
.svc-icon{width:56px;height:56px;border-radius:16px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:26px;}
.ic-cuci{background:#e0f0ff;}.ic-setrika{background:#fff0e0;}.ic-both{background:#e5f8f0;}
.svc-name{font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;color:var(--text-dark);margin-bottom:4px;}
.svc-price{font-size:12px;color:var(--text-soft);font-weight:600;}
.svc-badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:10px;margin-top:8px;}
.badge-std{background:#e0f0ff;color:#2060a8;}.badge-pop{background:#e5f8f0;color:#1a7040;}
.price-list{background:var(--white);border:1.5px solid var(--border);border-radius:14px;padding:16px;}
.price-list-title{font-size:13px;font-weight:700;color:var(--text-dark);margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.price-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--blue-pale);}
.price-row:last-child{border-bottom:none;}
.price-row-name{font-size:13px;color:var(--text-med);display:flex;align-items:center;gap:6px;}
.price-row-val{font-size:13px;font-weight:700;color:var(--blue);}

/* BACK BUTTON */
.back-btn{display:inline-flex;align-items:center;gap:6px;color:var(--text-soft);font-size:13px;font-weight:700;cursor:pointer;margin-bottom:16px;padding:7px 14px;border-radius:10px;border:none;background:rgba(90,133,184,0.1);transition:all 0.2s;font-family:'Nunito',sans-serif;}
.back-btn:hover{background:rgba(90,133,184,0.18);color:var(--blue);}

/* INPUT PAGE */
.input-card{background:var(--white);border:1.5px solid var(--border);border-radius:18px;padding:22px 18px;margin-bottom:14px;}
.input-svc-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:14px;border-bottom:1.5px solid var(--blue-pale);}
.input-svc-icon{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.input-svc-name{font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;color:var(--text-dark);}
.input-svc-price{font-size:12px;color:var(--text-soft);}
.field-label{font-size:13px;font-weight:700;color:var(--text-dark);margin-bottom:8px;}
.field-input{width:100%;border:2px solid var(--border);border-radius:12px;padding:11px 14px;font-size:14px;font-family:'Nunito',sans-serif;color:var(--text-dark);background:var(--blue-card);outline:none;transition:border-color 0.2s;margin-bottom:16px;}
.field-input:focus{border-color:var(--blue);}
.field-input.err{border-color:#e05050;}
.kg-row{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.kg-btn{width:42px;height:42px;border-radius:11px;border:2px solid var(--border);background:var(--blue-card);color:var(--blue);font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0;font-family:'Poppins',sans-serif;}
.kg-btn:hover{background:var(--blue);color:#fff;border-color:var(--blue);}
.kg-input{flex:1;text-align:center;font-size:30px;font-weight:800;color:var(--text-dark);border:2px solid var(--border);border-radius:12px;padding:8px;font-family:'Poppins',sans-serif;background:var(--blue-card);outline:none;}
.kg-input:focus{border-color:var(--blue);}
.kg-unit{font-size:15px;font-weight:700;color:var(--text-soft);}
.price-banner{background:linear-gradient(135deg,var(--blue) 0%,var(--blue-med) 100%);border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.price-banner-label{color:rgba(255,255,255,0.75);font-size:12px;font-weight:600;margin-bottom:2px;}
.price-banner-amount{color:#fff;font-size:24px;font-weight:800;font-family:'Poppins',sans-serif;}
.price-banner-right{text-align:right;}
.price-banner-kg{color:rgba(255,255,255,0.9);font-size:14px;font-weight:700;}
.price-banner-rate{color:rgba(255,255,255,0.6);font-size:11px;}
.submit-btn{width:100%;background:linear-gradient(135deg,var(--blue-dark),var(--blue));color:#fff;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:800;font-family:'Poppins',sans-serif;cursor:pointer;transition:all 0.2s;letter-spacing:0.3px;}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(58,126,200,0.35);}
.submit-btn:active{transform:translateY(0);}

/* HISTORY PAGE */
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
.sum-card{background:var(--white);border:1.5px solid var(--border);border-radius:14px;padding:14px 10px;text-align:center;}
.sum-val{font-family:'Poppins',sans-serif;font-weight:800;font-size:17px;color:var(--blue);margin-bottom:2px;}
.sum-lbl{font-size:11px;color:var(--text-soft);font-weight:600;}
.hist-actions{display:flex;gap:8px;margin-bottom:18px;}
.export-btn{flex:1;background:linear-gradient(135deg,#1e8050,#28a865);color:#fff;border:none;border-radius:12px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'Nunito',sans-serif;transition:all 0.2s;}
.export-btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(30,128,80,0.3);}
.clear-all-btn{background:rgba(201,64,64,0.08);border:1.5px solid rgba(201,64,64,0.25);color:var(--red);border-radius:12px;padding:11px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;transition:all 0.2s;white-space:nowrap;}
.clear-all-btn:hover{background:rgba(201,64,64,0.15);}
.month-group{margin-bottom:16px;}
.month-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:linear-gradient(90deg,var(--blue-pale),var(--blue-bg));border-radius:12px;margin-bottom:8px;border-left:4px solid var(--blue);}
.month-name{font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;color:var(--text-dark);}
.month-stats{font-size:11px;color:var(--text-soft);font-weight:600;}
.month-total{font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;color:var(--blue);}
.tx-list{display:flex;flex-direction:column;gap:8px;}
.tx-item{background:var(--white);border:1.5px solid var(--border);border-radius:13px;padding:12px 14px;display:flex;align-items:center;gap:12px;transition:all 0.15s;}
.tx-item:hover{box-shadow:var(--shadow);}
.tx-svc-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.tx-info{flex:1;min-width:0;}
.tx-name{font-weight:700;font-size:14px;color:var(--text-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-svc{font-size:12px;color:var(--text-soft);font-weight:600;}
.tx-date{font-size:11px;color:var(--text-muted);margin-top:1px;}
.tx-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.tx-price-wrap{text-align:right;}
.tx-price{font-family:'Poppins',sans-serif;font-weight:800;font-size:14px;color:var(--blue);}
.tx-kg{font-size:11px;color:var(--text-muted);font-weight:600;}
.del-btn{width:30px;height:30px;border-radius:8px;border:1.5px solid rgba(201,64,64,0.25);background:rgba(201,64,64,0.07);color:var(--red);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;}
.del-btn:hover{background:rgba(201,64,64,0.18);border-color:rgba(201,64,64,0.5);}
.empty-state{text-align:center;padding:48px 20px;color:var(--text-soft);}
.empty-icon{font-size:52px;margin-bottom:12px;}
.empty-title{font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;color:var(--text-dark);margin-bottom:6px;}
.empty-sub{font-size:13px;color:var(--text-soft);}

/* EXPORT MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(10,30,60,0.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px);}
.modal{background:var(--white);border-radius:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.2);}
.modal-header{background:linear-gradient(135deg,var(--blue-dark),var(--blue));padding:18px 20px;border-radius:20px 20px 0 0;display:flex;align-items:center;justify-content:space-between;}
.modal-title{color:#fff;font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;}
.modal-close{background:rgba(255,255,255,0.2);border:none;color:#fff;width:32px;height:32px;border-radius:8px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
.modal-close:hover{background:rgba(255,255,255,0.35);}
.modal-body{padding:20px;}
.modal-section{margin-bottom:18px;}
.modal-section-title{font-size:13px;font-weight:700;color:var(--text-dark);margin-bottom:10px;}
.type-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:18px;}
.type-tab{padding:9px 6px;border:2px solid var(--border);border-radius:11px;background:var(--blue-card);color:var(--text-soft);font-size:12px;font-weight:700;cursor:pointer;text-align:center;transition:all 0.18s;font-family:'Nunito',sans-serif;}
.type-tab:hover{border-color:var(--blue-med);color:var(--blue);}
.type-tab.active{background:var(--blue);border-color:var(--blue);color:#fff;}
.modal-field{margin-bottom:12px;}
.modal-label{font-size:12px;font-weight:700;color:var(--text-med);margin-bottom:6px;}
.modal-select,.modal-input-date{width:100%;border:2px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;font-family:'Nunito',sans-serif;color:var(--text-dark);background:var(--blue-card);outline:none;transition:border-color 0.2s;}
.modal-select:focus,.modal-input-date:focus{border-color:var(--blue);}
.preview-box{background:var(--blue-pale);border:1.5px solid var(--blue-light);border-radius:12px;padding:12px 14px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
.preview-label{font-size:12px;color:var(--text-soft);font-weight:600;}
.preview-count{font-family:'Poppins',sans-serif;font-weight:800;font-size:20px;color:var(--blue);}
.preview-sub{font-size:11px;color:var(--text-soft);}
.dl-btn{width:100%;background:linear-gradient(135deg,#1e8050,#28a865);color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:800;font-family:'Poppins',sans-serif;cursor:pointer;transition:all 0.2s;}
.dl-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(30,128,80,0.3);}
.dl-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none;}
.week-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.confirm-overlay{position:fixed;inset:0;background:rgba(10,30,60,0.4);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;}
.confirm-box{background:var(--white);border-radius:16px;padding:24px 20px;max-width:300px;width:100%;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,0.18);}
.confirm-icon{font-size:36px;margin-bottom:10px;}
.confirm-title{font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;color:var(--text-dark);margin-bottom:6px;}
.confirm-msg{font-size:13px;color:var(--text-soft);margin-bottom:18px;}
.confirm-actions{display:flex;gap:8px;}
.confirm-cancel{flex:1;background:var(--blue-pale);border:1.5px solid var(--border);color:var(--text-soft);border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;}
.confirm-ok{flex:1;background:var(--red);border:none;color:#fff;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Nunito',sans-serif;}
.confirm-ok:hover{background:#a83030;}
</style>
</head>
<body>
<div class="app-wrapper">
  <div class="toast" id="toast"></div>

  <!-- HEADER -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🫧</div>
      <div>
        <div class="logo-text">Akila Laundry</div>
        <div class="logo-sub">Bersih • Cepat • Terpercaya</div>
      </div>
    </div>
    <div class="nav">
      <button class="nav-btn active" id="nav-menu" onclick="goPage('menu')">Layanan</button>
      <button class="nav-btn" id="nav-history" onclick="goPage('history')">Riwayat</button>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="body" id="content"></div>
</div>

<!-- EXPORT MODAL -->
<div class="modal-overlay" id="exportModal" style="display:none;" onclick="closeModalOnOverlay(event)">
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <div class="modal-title">📊 Ekspor ke Excel</div>
      <button class="modal-close" onclick="closeExportModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-section-title">Pilih Periode Ekspor</div>
      <div class="type-tabs">
        <button class="type-tab active" onclick="setExportType('daily')">📅 Harian</button>
        <button class="type-tab" onclick="setExportType('weekly')">📆 Mingguan</button>
        <button class="type-tab" onclick="setExportType('monthly')">🗓 Bulanan</button>
        <button class="type-tab" onclick="setExportType('yearly')">📋 Tahunan</button>
      </div>
      <div id="exportFields"></div>
      <div class="preview-box">
        <div>
          <div class="preview-label">Data Ditemukan</div>
          <div class="preview-sub" id="previewSub">—</div>
        </div>
        <div style="text-align:right">
          <div class="preview-count" id="previewCount">0</div>
          <div class="preview-label">transaksi</div>
        </div>
      </div>
      <button class="dl-btn" id="dlBtn" onclick="doExport()">⬇ Download Excel</button>
    </div>
  </div>
</div>

<!-- CONFIRM DIALOG -->
<div class="confirm-overlay" id="confirmOverlay" style="display:none;">
  <div class="confirm-box">
    <div class="confirm-icon" id="confirmIcon">🗑</div>
    <div class="confirm-title" id="confirmTitle">Hapus Transaksi?</div>
    <div class="confirm-msg" id="confirmMsg">Data ini akan dihapus permanen.</div>
    <div class="confirm-actions">
      <button class="confirm-cancel" onclick="closeConfirm()">Batal</button>
      <button class="confirm-ok" id="confirmOk">Hapus</button>
    </div>
  </div>
</div>

<script>
const SERVICES = {
  cuci:    { name:'Cuci',           icon:'🫧', price:3000, cls:'ic-cuci' },
  setrika: { name:'Setrika',        icon:'🏷️', price:3000, cls:'ic-setrika' },
  both:    { name:'Cuci & Setrika', icon:'✨', price:5000, cls:'ic-both' }
};

const LS_KEY = 'akila_laundry_v1';
let transactions = [];
let currentPage = 'menu';
let selectedService = null;
let exportType = 'daily';
let confirmCallback = null;

// ===== STORAGE =====
function loadData(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    transactions = raw ? JSON.parse(raw) : [];
  } catch(e){ transactions = []; }
}
function saveData(){
  localStorage.setItem(LS_KEY, JSON.stringify(transactions));
}

// ===== UTILS =====
function formatRp(n){ return 'Rp '+Number(n).toLocaleString('id-ID'); }
function formatDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})+
    ' '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
}
function formatMonth(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('id-ID',{month:'long',year:'numeric'});
}
function getMonthKey(ts){
  const d = new Date(ts);
  return d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0');
}
function getISOWeek(d){
  const date = new Date(d);
  date.setHours(0,0,0,0);
  date.setDate(date.getDate()+3-(date.getDay()+6)%7);
  const week1 = new Date(date.getFullYear(),0,4);
  return 1+Math.round(((date-week1)/86400000-3+(week1.getDay()+6)%7)/7);
}
function showToast(msg, err=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast'+(err?' error':'')+' show';
  setTimeout(()=>t.className='toast',2400);
}
function showConfirm(icon, title, msg, cb){
  document.getElementById('confirmIcon').textContent = icon;
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMsg').textContent = msg;
  document.getElementById('confirmOk').onclick = ()=>{ closeConfirm(); cb(); };
  document.getElementById('confirmOverlay').style.display = 'flex';
}
function closeConfirm(){ document.getElementById('confirmOverlay').style.display='none'; }

// ===== NAVIGATION =====
function goPage(page){
  currentPage = page;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(page==='history'?'nav-history':'nav-menu')?.classList.add('active');
  render();
}

// ===== RENDER =====
function render(){
  const el = document.getElementById('content');
  if(currentPage==='menu') el.innerHTML = renderMenu();
  else if(currentPage==='input') el.innerHTML = renderInput();
  else if(currentPage==='history') el.innerHTML = renderHistory();
}

function renderMenu(){
  return `
    <div class="page-title">Pilih Layanan</div>
    <p class="page-sub">Layanan laundry profesional untuk kebutuhan Anda</p>
    <div class="svc-grid">
      <div class="svc-card" onclick="selectService('cuci')">
        <div class="svc-icon ic-cuci">🫧</div>
        <div class="svc-name">Cuci</div>
        <div class="svc-price">Rp 3.000 / kg</div>
        <span class="svc-badge badge-std">Standar</span>
      </div>
      <div class="svc-card" onclick="selectService('setrika')">
        <div class="svc-icon ic-setrika">🏷️</div>
        <div class="svc-name">Setrika</div>
        <div class="svc-price">Rp 3.000 / kg</div>
        <span class="svc-badge badge-std">Standar</span>
      </div>
      <div class="svc-card" onclick="selectService('both')">
        <div class="svc-icon ic-both">✨</div>
        <div class="svc-name">Cuci & Setrika</div>
        <div class="svc-price">Rp 5.000 / kg</div>
        <span class="svc-badge badge-pop">⭐ Populer</span>
      </div>
    </div>
    <div class="price-list">
      <div class="price-list-title">📋 Daftar Harga</div>
      <div class="price-row"><span class="price-row-name">🫧 Cuci</span><span class="price-row-val">Rp 3.000 / kg</span></div>
      <div class="price-row"><span class="price-row-name">🏷️ Setrika</span><span class="price-row-val">Rp 3.000 / kg</span></div>
      <div class="price-row"><span class="price-row-name">✨ Cuci & Setrika</span><span class="price-row-val">Rp 5.000 / kg</span></div>
    </div>`;
}

function selectService(key){
  selectedService = key;
  currentPage = 'input';
  render();
  setTimeout(()=>{ updatePrice(); document.getElementById('custName')?.focus(); }, 50);
}

function renderInput(){
  const s = SERVICES[selectedService];
  return `
    <button class="back-btn" onclick="goPage('menu')">← Kembali</button>
    <div class="input-card">
      <div class="input-svc-head">
        <div class="input-svc-icon ${s.cls}">${s.icon}</div>
        <div>
          <div class="input-svc-name">${s.name}</div>
          <div class="input-svc-price">Rp ${s.price.toLocaleString('id-ID')} / kg</div>
        </div>
      </div>
      <div class="field-label">Nama Pelanggan</div>
      <input class="field-input" id="custName" placeholder="Masukkan nama pelanggan..." autocomplete="off"/>
      <div class="field-label">Jumlah Berat</div>
      <div class="kg-row">
        <button class="kg-btn" onclick="changeKg(-1)">−</button>
        <input class="kg-input" type="number" id="kgInput" value="1" min="1" step="0.5" oninput="updatePrice()"/>
        <button class="kg-btn" onclick="changeKg(1)">+</button>
        <span class="kg-unit">kg</span>
      </div>
    </div>
    <div class="price-banner">
      <div>
        <div class="price-banner-label">Total Harga</div>
        <div class="price-banner-amount" id="priceDisplay">Rp 0</div>
      </div>
      <div class="price-banner-right">
        <div class="price-banner-kg" id="kgDisplay">1 kg</div>
        <div class="price-banner-rate">@ Rp ${s.price.toLocaleString('id-ID')} / kg</div>
      </div>
    </div>
    <button class="submit-btn" onclick="submitOrder()">✓ Buat Transaksi</button>`;
}

function changeKg(d){
  const inp = document.getElementById('kgInput');
  let v = parseFloat(inp.value)||1;
  v = Math.max(0.5, +(v+d).toFixed(1));
  inp.value = v;
  updatePrice();
}

function updatePrice(){
  const kg = parseFloat(document.getElementById('kgInput')?.value)||0;
  const s = SERVICES[selectedService];
  const total = kg * s.price;
  const pd = document.getElementById('priceDisplay');
  const kd = document.getElementById('kgDisplay');
  if(pd) pd.textContent = formatRp(total);
  if(kd) kd.textContent = kg+' kg';
}

function submitOrder(){
  const custEl = document.getElementById('custName');
  const kgEl = document.getElementById('kgInput');
  const name = custEl?.value?.trim()||'';
  const kg = parseFloat(kgEl?.value)||0;
  if(!name){ custEl.classList.add('err'); custEl.focus(); showToast('⚠ Nama pelanggan wajib diisi!',true); return; }
  custEl.classList.remove('err');
  if(kg<0.5){ kgEl.classList.add('err'); kgEl.focus(); showToast('⚠ Berat minimal 0.5 kg!',true); return; }
  kgEl.classList.remove('err');
  const s = SERVICES[selectedService];
  const tx = { id:Date.now(), service:selectedService, name, kg, total:Math.round(kg*s.price), ts:Date.now() };
  transactions.unshift(tx);
  saveData();
  showToast('✓ Transaksi berhasil disimpan!');
  setTimeout(()=>goPage('history'), 800);
}

function renderHistory(){
  const total = transactions.length;
  const totalKg = transactions.reduce((a,t)=>a+t.kg,0);
  const totalRp = transactions.reduce((a,t)=>a+t.total,0);
  let html = `
    <div class="page-title">Riwayat Transaksi</div>
    <p class="page-sub">${total} transaksi tercatat</p>
    <div class="summary-grid">
      <div class="sum-card"><div class="sum-val">${total}</div><div class="sum-lbl">Transaksi</div></div>
      <div class="sum-card"><div class="sum-val">${totalKg} kg</div><div class="sum-lbl">Total Berat</div></div>
      <div class="sum-card"><div class="sum-val" style="font-size:13px;">${formatRp(totalRp)}</div><div class="sum-lbl">Pendapatan</div></div>
    </div>`;

  if(total > 0){
    html += `<div class="hist-actions">
      <button class="export-btn" onclick="openExportModal()">📊 Ekspor Excel</button>
      <button class="clear-all-btn" onclick="confirmClearAll()">🗑 Hapus Semua</button>
    </div>`;

    // Group by month
    const groups = {};
    transactions.forEach(t => {
      const key = getMonthKey(t.ts);
      if(!groups[key]) groups[key] = [];
      groups[key].push(t);
    });

    Object.keys(groups).sort((a,b)=>b.localeCompare(a)).forEach(key => {
      const list = groups[key];
      const mTotal = list.reduce((a,t)=>a+t.total,0);
      const mKg = list.reduce((a,t)=>a+t.kg,0);
      const mLabel = formatMonth(list[0].ts);
      html += `<div class="month-group">
        <div class="month-header">
          <div>
            <div class="month-name">📅 ${mLabel}</div>
            <div class="month-stats">${list.length} transaksi · ${mKg} kg</div>
          </div>
          <div class="month-total">${formatRp(mTotal)}</div>
        </div>
        <div class="tx-list">`;
      list.forEach(t => {
        const s = SERVICES[t.service];
        html += `<div class="tx-item" id="tx-${t.id}">
          <div class="tx-svc-icon ${s.cls}">${s.icon}</div>
          <div class="tx-info">
            <div class="tx-name">${t.name}</div>
            <div class="tx-svc">${s.name}</div>
            <div class="tx-date">${formatDate(t.ts)}</div>
          </div>
          <div class="tx-right">
            <div class="tx-price-wrap">
              <div class="tx-price">${formatRp(t.total)}</div>
              <div class="tx-kg">${t.kg} kg</div>
            </div>
            <button class="del-btn" onclick="confirmDelete(${t.id})" title="Hapus">✕</button>
          </div>
        </div>`;
      });
      html += `</div></div>`;
    });
  } else {
    html += `<div class="empty-state">
      <div class="empty-icon">🫧</div>
      <div class="empty-title">Belum Ada Transaksi</div>
      <p class="empty-sub">Mulai dengan memilih layanan di halaman Layanan</p>
    </div>`;
  }
  return html;
}

function confirmDelete(id){
  const tx = transactions.find(t=>t.id===id);
  if(!tx) return;
  showConfirm('🗑','Hapus Transaksi?',
    `Hapus transaksi atas nama "${tx.name}"? Tindakan ini tidak dapat dibatalkan.`,
    ()=>deleteTransaction(id));
}
function deleteTransaction(id){
  transactions = transactions.filter(t=>t.id!==id);
  saveData();
  showToast('🗑 Transaksi dihapus');
  render();
}
function confirmClearAll(){
  showConfirm('⚠️','Hapus Semua Riwayat?',
    `Semua ${transactions.length} transaksi akan dihapus permanen.`,
    ()=>{ transactions=[]; saveData(); showToast('🗑 Semua riwayat dihapus'); render(); });
}

// ===== EXPORT MODAL =====
let exportedData = [];
function openExportModal(){
  document.getElementById('exportModal').style.display='flex';
  setExportType('daily');
}
function closeExportModal(){ document.getElementById('exportModal').style.display='none'; }
function closeModalOnOverlay(e){ if(e.target.id==='exportModal') closeExportModal(); }

function setExportType(type){
  exportType = type;
  document.querySelectorAll('.type-tab').forEach((b,i)=>{
    b.classList.toggle('active',['daily','weekly','monthly','yearly'][i]===type);
  });
  const now = new Date();
  const yr = now.getFullYear();
  const mo = now.getMonth()+1;
  const wk = getISOWeek(now);
  const todayStr = now.toISOString().slice(0,10);

  const years = [...new Set(transactions.map(t=>new Date(t.ts).getFullYear()))].sort((a,b)=>b-a);
  if(!years.includes(yr)) years.unshift(yr);
  const yearOpts = years.map(y=>`<option value="${y}" ${y===yr?'selected':''}>${y}</option>`).join('');

  const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const monthOpts = months.map((m,i)=>`<option value="${i+1}" ${i+1===mo?'selected':''}>${m}</option>`).join('');

  const weekOpts = Array.from({length:52},(_, i)=>`<option value="${i+1}" ${i+1===wk?'selected':''}>${'Minggu ke-'+(i+1)}</option>`).join('');

  let fields = '';
  if(type==='daily'){
    fields = `<div class="modal-field"><div class="modal-label">Pilih Tanggal</div>
      <input type="date" class="modal-input-date" id="expDate" value="${todayStr}" oninput="updatePreview()"/></div>`;
  } else if(type==='weekly'){
    fields = `<div class="week-row">
      <div class="modal-field"><div class="modal-label">Tahun</div>
        <select class="modal-select" id="expYear" onchange="updatePreview()">${yearOpts}</select></div>
      <div class="modal-field"><div class="modal-label">Minggu</div>
        <select class="modal-select" id="expWeek" onchange="updatePreview()">${weekOpts}</select></div>
    </div>`;
  } else if(type==='monthly'){
    fields = `<div class="week-row">
      <div class="modal-field"><div class="modal-label">Tahun</div>
        <select class="modal-select" id="expYear" onchange="updatePreview()">${yearOpts}</select></div>
      <div class="modal-field"><div class="modal-label">Bulan</div>
        <select class="modal-select" id="expMonth" onchange="updatePreview()">${monthOpts}</select></div>
    </div>`;
  } else {
    fields = `<div class="modal-field"><div class="modal-label">Tahun</div>
      <select class="modal-select" id="expYear" onchange="updatePreview()">${yearOpts}</select></div>`;
  }
  document.getElementById('exportFields').innerHTML = fields;
  updatePreview();
}

function getFilteredData(){
  const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  if(exportType==='daily'){
    const dateVal = document.getElementById('expDate')?.value||'';
    const filtered = transactions.filter(t=>new Date(t.ts).toISOString().slice(0,10)===dateVal);
    const label = dateVal ? new Date(dateVal).toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'}) : '—';
    return {filtered, label};
  } else if(exportType==='weekly'){
    const y = parseInt(document.getElementById('expYear')?.value)||new Date().getFullYear();
    const w = parseInt(document.getElementById('expWeek')?.value)||1;
    const filtered = transactions.filter(t=>{
      const d = new Date(t.ts);
      return d.getFullYear()===y && getISOWeek(d)===w;
    });
    return {filtered, label:`Minggu ke-${w}, Tahun ${y}`};
  } else if(exportType==='monthly'){
    const y = parseInt(document.getElementById('expYear')?.value)||new Date().getFullYear();
    const m = parseInt(document.getElementById('expMonth')?.value)||1;
    const filtered = transactions.filter(t=>{
      const d = new Date(t.ts);
      return d.getFullYear()===y && (d.getMonth()+1)===m;
    });
    return {filtered, label:`${months[m-1]} ${y}`};
  } else {
    const y = parseInt(document.getElementById('expYear')?.value)||new Date().getFullYear();
    const filtered = transactions.filter(t=>new Date(t.ts).getFullYear()===y);
    return {filtered, label:`Tahun ${y}`};
  }
}

function updatePreview(){
  const {filtered, label} = getFilteredData();
  exportedData = filtered;
  document.getElementById('previewCount').textContent = filtered.length;
  const totalRp = filtered.reduce((a,t)=>a+t.total,0);
  document.getElementById('previewSub').textContent = label + (filtered.length>0 ? ` · ${formatRp(totalRp)}` : '');
  document.getElementById('dlBtn').disabled = filtered.length===0;
}

function doExport(){
  const {filtered, label} = getFilteredData();
  if(filtered.length===0){ showToast('⚠ Tidak ada data untuk diekspor',true); return; }

  const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const rows = filtered.map(t=>{
    const d = new Date(t.ts);
    const s = SERVICES[t.service];
    return {
      'No. Transaksi': t.id,
      'Tanggal': d.toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'}),
      'Waktu': d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),
      'Nama Pelanggan': t.name,
      'Layanan': s.name,
      'Berat (kg)': t.kg,
      'Harga per kg (Rp)': SERVICES[t.service].price,
      'Total (Rp)': t.total
    };
  });

  // Summary row
  const totalKg = filtered.reduce((a,t)=>a+t.kg,0);
  const totalRp = filtered.reduce((a,t)=>a+t.total,0);
  rows.push({});
  rows.push({
    'No. Transaksi':'TOTAL',
    'Tanggal':'',
    'Waktu':'',
    'Nama Pelanggan':'',
    'Layanan': `${filtered.length} transaksi`,
    'Berat (kg)': totalKg,
    'Harga per kg (Rp)':'',
    'Total (Rp)': totalRp
  });

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(rows);

  // Column widths
  ws['!cols'] = [
    {wch:18},{wch:22},{wch:10},{wch:22},{wch:18},{wch:12},{wch:18},{wch:16}
  ];

  const sheetName = ('Riwayat-'+label).replace(/[\/\\?\*\[\]]/g,'').slice(0,31);
  XLSX.utils.book_append_sheet(wb, ws, sheetName);

  const filename = `AkilaLaundry_${label.replace(/[^a-zA-Z0-9]/g,'_')}.xlsx`;
  XLSX.writeFile(wb, filename);
  showToast(`✓ File "${filename}" berhasil diunduh!`);
  closeExportModal();
}

// ===== INIT =====
loadData();
render();
</script>
